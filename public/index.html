<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>10K Prompt · Máquina de Anúncios</title><style>*{box-sizing:border-box}body{margin:0;background:#080b10;color:#f7f8fb;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:1120px;margin:auto;padding:22px}.brand{font-weight:900}.brand b{background:#ff6900;padding:8px;border-radius:9px;margin-right:7px}.top,.actions{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}.nav,.btn{border:0;border-radius:11px;padding:11px 13px;font-weight:800;cursor:pointer}.nav{background:#151d29;color:#ddd;border:1px solid #344055}.nav.active{border-color:#ff6900;color:#ff8b3d}.btn{background:#ff6900;color:#fff;width:100%;margin-top:10px}.secondary{background:#222c3b}.hero{padding:38px 0 14px}.hero h1{font-size:clamp(38px,6vw,68px);line-height:.96;margin:0}.orange{color:#ff6900}.sub,.status,label{color:#96a2b4}.card,.panel{background:#121822;border:1px solid #293446;border-radius:18px;padding:17px;margin:14px 0}.grid,.controls,.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}.drop{min-height:210px;border:2px dashed #39465a;border-radius:15px;display:grid;place-items:center;text-align:center;cursor:pointer;overflow:hidden}.drop img{max-width:100%;max-height:360px}.row{border-bottom:1px solid #273142;padding:9px 0}.row small,label{display:block;font-size:10px;font-weight:900;text-transform:uppercase}.controls select,.controls input,.field{width:100%;padding:11px;background:#0d131c;color:#fff;border:1px solid #303b4d;border-radius:10px}.mini,.take{background:#0d131c;border:1px solid #293446;border-radius:13px;padding:12px;margin:8px 0}.pill{display:inline-block;border:1px solid #344055;border-radius:999px;padding:4px 8px;margin:3px;font-size:12px}.score{font-size:38px;color:#ff8b3d;font-weight:900}.prompt{white-space:pre-wrap;background:#080c12;padding:11px;border-radius:9px}.hidden{display:none!important}.login{position:fixed;inset:0;background:#070a0ff2;display:grid;place-items:center;z-index:9}.loginbox{width:min(390px,90%);background:#121822;padding:22px;border-radius:18px}.passrow{position:relative}.login input{width:100%;padding:13px 54px 13px 13px;font-size:18px}.eye{position:absolute;right:7px;top:7px;border:0;background:#e9edf4;border-radius:8px;padding:7px 10px;font-size:20px;cursor:pointer}.good{color:#70d69a}@media(max-width:760px){.grid,.controls,.cards{grid-template-columns:1fr}}</style></head><body><div id="login" class="login"><div class="loginbox"><div class="brand"><b>10K</b>Prompt</div><h2>Entrar</h2><div class="passrow"><input id="pass" type="password" autocomplete="current-password" placeholder="Digite sua senha"><button id="showPass" class="eye" type="button">👁️</button></div><button id="loginBtn" class="btn">Entrar</button><div id="loginStatus" class="status"></div></div></div><div class="wrap"><div class="top"><div class="brand"><b>10K</b> Máquina de Anúncios</div><div class="actions"><button class="nav active" data-view="create">Criar</button><button class="nav" data-view="products">Produtos</button><button class="nav" data-view="performance">Performance</button><button class="nav" data-view="history">Histórico</button><button id="logout" class="nav">Sair</button></div></div><main id="create"><div class="hero"><h1>Criação + <span class="orange">otimização.</span></h1><div class="sub">Do produto à estratégia, criativo, diagnóstico, campanha e aprendizado com resultados reais.</div></div><div class="grid"><div class="card"><h2>1. Produto</h2><div id="drop" class="drop"><div id="dropText">📸<br><b>Selecionar print</b></div><img id="preview" hidden></div><input id="file" type="file" accept="image/*" hidden><button id="analyze" class="btn" disabled>Analisar produto</button><div id="status" class="status"></div></div><div class="card"><h2>2. DNA do Produto</h2><div id="analysis" class="status">Aguardando produto.</div></div></div><div id="config" class="card hidden"><h2>3. Modo de criação</h2><div class="controls"><div><label>Modo</label><select id="mode"><option>Automático</option><option>Avançado</option></select></div><div><label>Formato</label><select id="format"><option>UGC</option><option>POV</option></select></div><div><label>Duração</label><select id="duration"><option>8</option><option selected>15</option><option>30</option></select></div><div><label>Gerador de prompt</label><select id="generator"><option>Genérico</option><option>Veo</option><option>Sora</option><option>Kling</option><option>LTX</option></select></div><div><label>Avatar</label><select id="avatar"><option>Automático</option><option>Mulher adulta</option><option>Homem adulto</option><option>Apenas mãos</option><option>Sem pessoa / apenas produto</option></select></div><div><label>Ambiente</label><select id="environment"><option>Automático</option><option>Quarto</option><option>Sala</option><option>Provador</option><option>Loja</option><option>Cozinha</option><option>Escritório</option><option>Academia</option><option>Interior do carro</option><option>Área externa</option></select></div><div><label>Estilo</label><select id="copyStyle"><option>Mix inteligente</option><option>Natural</option><option>Autoridade</option><option>Amigável</option><option>Urgente / Oferta</option><option>Curiosidade / Desconto</option></select></div><div><label>Intensidade</label><select id="intensity"><option>Suave</option><option selected>Equilibrado</option><option>Agressivo</option></select></div><div><label>Ângulo</label><select id="angleMode"><option>Automático</option><option>Praticidade</option><option>Problema / Dor</option><option>Desejo</option><option>Demonstração</option><option>Descoberta</option></select></div><div><label>Variações</label><select id="batch"><option value="1">1 anúncio</option><option value="3">3 anúncios</option><option value="5">5 anúncios</option></select></div></div><button id="generate" class="btn">Criar anúncio otimizado</button><button id="campaign" class="btn secondary">Criar campanha com 5 estratégias</button><div id="genStatus" class="status"></div></div><div id="result" class="card hidden"><h2>Resultado</h2><div id="resultBody"></div></div></main><main id="products" class="hidden"><div class="hero"><h1>Produtos</h1></div><input id="search" class="field" placeholder="Buscar produto"><div id="productList"></div></main><main id="performance" class="hidden"><div class="hero"><h1>Performance</h1></div><div id="perfList"></div></main><main id="history" class="hidden"><div class="hero"><h1>Histórico</h1></div><div id="historyList"></div></main></div><script>
const $=s=>document.querySelector(s),esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#39;'}[m]));let analysis=null,productId=null,currentId=null,history=[],copyPrompts=[];async function api(u,o={}){const r=await fetch(u,{cache:'no-store',...o}),d=await r.json().catch(()=>({}));if(r.status===401)$('#login').classList.remove('hidden');if(!r.ok)throw Error(d.error||'Erro');return d}async function auth(){try{const d=await fetch('/api/me',{cache:'no-store'}).then(r=>r.json());$('#login').classList.toggle('hidden',!!d.authenticated)}catch{$('#login').classList.remove('hidden')}}
$('#showPass').onclick=()=>{const p=$('#pass'),show=p.type==='password';p.type=show?'text':'password';$('#showPass').textContent=show?'🙈':'👁️'};async function doLogin(){const b=$('#loginBtn');b.disabled=true;$('#loginStatus').textContent='Entrando...';try{await api('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('#pass').value})});const me=await fetch('/api/me',{cache:'no-store'}).then(r=>r.json());if(!me.authenticated)throw Error('O navegador não manteve a sessão. Tente atualizar a página.');$('#login').classList.add('hidden');$('#loginStatus').textContent='';$('#pass').value=''}catch(e){$('#loginStatus').textContent=e.message}finally{b.disabled=false}}$('#loginBtn').onclick=doLogin;$('#pass').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});$('#logout').onclick=async()=>{await fetch('/api/logout',{method:'POST'});$('#login').classList.remove('hidden')};
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{document.querySelectorAll('main').forEach(x=>x.classList.add('hidden'));$('#'+b.dataset.view).classList.remove('hidden');document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('active',x===b));if(b.dataset.view==='products')loadProducts();if(b.dataset.view==='history')loadHistory();if(b.dataset.view==='performance')loadPerf()});$('#drop').onclick=()=>$('#file').click();$('#file').onchange=()=>{const f=$('#file').files[0];if(!f)return;$('#preview').src=URL.createObjectURL(f);$('#preview').hidden=false;$('#dropText').hidden=true;$('#analyze').disabled=false};function dna(a){const d=a.dna_produto||{};return `<div class="row"><small>Produto</small>${esc(a.produto)}</div><div class="row"><small>Benefício principal</small>${esc(a.beneficio_principal)}</div>${[['Dores',d.dores],['Desejos',d.desejos],['Objeções',d.objecoes],['Demonstrações',d.demonstracoes],['Ângulos permitidos',d.angulos_permitidos],['Promessas permitidas',d.promessas_permitidas]].map(x=>`<div class="row"><small>${x[0]}</small>${(x[1]||[]).map(v=>`<span class="pill">${esc(v)}</span>`).join('')||'—'}</div>`).join('')}`}$('#analyze').onclick=async()=>{const fd=new FormData();fd.append('image',$('#file').files[0]);$('#status').textContent='Construindo DNA...';try{analysis=await api('/api/analyze',{method:'POST',body:fd});productId=analysis._productId;$('#analysis').innerHTML=dna(analysis);$('#config').classList.remove('hidden');$('#status').textContent='DNA pronto.'}catch(e){$('#status').textContent=e.message}};
function fullPrompt(t){return `FALA:\n${t.fala||''}\n\nCENA:\n${t.cena||''}\n\nAÇÃO:\n${t.acao||''}\n\nENQUADRAMENTO:\n${t.enquadramento||''}\n\nPROMPT DE VÍDEO:\n${t.prompt_video||''}`}
function render(c){currentId=c._creativeId||currentId;copyPrompts=(c.takes||[]).map(fullPrompt);const d=c.diagnostico||{},o=c.objection_killer||{};$('#resultBody').innerHTML=`<div class="panel"><b>Estratégia</b><p>${esc(c.estrutura_escolhida)} · ${esc(c.angulo_escolhido)}</p><p><b>Pattern Interrupt:</b> ${esc(c.pattern_interrupt)}</p><p><b>Objection Killer:</b> ${esc(o.objecao)} → ${esc(o.resposta_no_criativo)}</p></div><div class="panel"><div class="score">${esc(d.potencial_venda)}/100</div><div class="status">Diagnóstico criativo, não garantia de vendas.</div></div>${(c.takes||[]).map((t,i)=>`<div class="take"><h3>TAKE ${esc(t.take)} · ${esc(t.titulo)}</h3><p><b>Fala:</b> “${esc(t.fala)}”</p><p><b>Cena:</b> ${esc(t.cena)}</p><p><b>Ação:</b> ${esc(t.acao)}</p><div class="prompt">${esc(t.prompt_video)}</div><button class="btn secondary" data-copy-index="${i}">Copiar prompt completo</button></div>`).join('')}`;$('#result').classList.remove('hidden');document.querySelectorAll('[data-copy-index]').forEach(b=>b.onclick=async()=>{const old=b.textContent;try{await navigator.clipboard.writeText(copyPrompts[+b.dataset.copyIndex]);b.textContent='✓ Prompt copiado'}catch{b.textContent='Não foi possível copiar'}setTimeout(()=>b.textContent=old,1500)})}function payload(){return{analysis,productId,mode:$('#mode').value,format:$('#format').value,duration:+$('#duration').value,generator:$('#generator').value,avatar:$('#avatar').value,environment:$('#environment').value,copyStyle:$('#copyStyle').value,intensity:$('#intensity').value,angleMode:$('#angleMode').value,batchCount:+$('#batch').value}}$('#generate').onclick=async()=>{try{$('#genStatus').textContent='Criando...';const d=await api('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload())});render(d.batch?d.creatives[0]:d);$('#genStatus').textContent='Pronto.'}catch(e){$('#genStatus').textContent=e.message}};$('#campaign').onclick=async()=>{try{const d=await api('/api/campaign',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({analysis,productId})});alert('Campanha criada com '+(d.campanha||[]).length+' estratégias.')}catch(e){$('#genStatus').textContent=e.message}};async function loadProducts(){const p=await api('/api/products');window.__p=p;$('#productList').innerHTML=p.map((x,i)=>`<div class="card"><b>${esc(x.analysis?.produto)}</b><button class="btn secondary" onclick="useProduct(${i})">Usar DNA</button></div>`).join('')}window.useProduct=i=>{const x=window.__p[i];analysis=x.analysis;productId=x.id;$('#analysis').innerHTML=dna(analysis);$('#config').classList.remove('hidden');document.querySelector('[data-view="create"]').click()};async function loadHistory(){history=await api('/api/history');$('#historyList').innerHTML=history.map(x=>`<div class="card"><b>${esc(x.productName)}</b><p>${esc(x.creative?.hook_escolhido)}</p></div>`).join('')}async function loadPerf(){const p=await api('/api/performance');$('#perfList').innerHTML=p.length?p.map(x=>`<div class="card"><b>${esc(x.productName)}</b> · ${esc(x.rating)}<p>Views ${esc(x.views)} · Retenção ${esc(x.retention)}% · Pedidos ${esc(x.orders)}</p></div>`).join(''):'<div class="status">Ainda não há resultados registrados.</div>'}auth();</script></body></html>
